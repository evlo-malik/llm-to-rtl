name: Verify compiler and RTL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-09-12'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Download pinned pretrained examples
        run: |
          .venv/bin/python scripts/fetch_example.py
          .venv/bin/python scripts/fetch_stories.py
      - name: Compare software and RTL
        run: .venv/bin/python -m pytest tests -q
      - name: Audit a complete pretrained circuit
        run: |
          .venv/bin/python compiler/compile.py models/stories260k --out gen/ci-stories --context 8
          .venv/bin/python syn/synth.py gen/ci-stories --yosys "$(command -v yosys)"
